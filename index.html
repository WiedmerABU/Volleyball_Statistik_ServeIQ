/** ServeIQ v0.1 – pure, deterministic volleyball rules and statistics. */
const VERSION = 1;
const uid = () => (globalThis.crypto?.randomUUID?.() || `id-${Date.now()}-${Math.random().toString(36).slice(2)}`);
const opposite = s => s === 'home' ? 'away' : 'home';
const sideOpposite = s => s === 'left' ? 'right' : 'left';
const setTarget = number => number === 5 ? 15 : 25;
const wonSet = (h, a, number) => Math.max(h,a) >= setTarget(number) && Math.abs(h-a) >= 2;
const newAppData = () => ({schema:VERSION, teams:[],matches:[],draft:null, lastView:'home',introSeen:false});
function teamName(t) {
  return [t.club, t.category, t.league, t.group?`Gr. ${t.group}`:'', t.season].filter(Boolean).join(' · ');
}
const playerLabel = p => p ? `#${p.number} ${p.first} ${p.last}`.trim() : '–';
const clone = x => JSON.parse(JSON.stringify(x));
function newMatch(team, opponent, date, rosterIds) {
  if (!team || !opponent?.trim() || rosterIds.length < 6) throw Error('Team, Gegner und mindestens 6 Spielerinnen erforderlich.');
  const chosen=team.players.filter(p=>rosterIds.includes(p.id));
  if(new Set(rosterIds).size!==rosterIds.length || chosen.length!==rosterIds.length)throw Error('Matchkader enthält doppelte oder ungültige Spielerinnen.');
  if(new Set(chosen.map(p=>Number(p.number))).size!==chosen.length)throw Error('Doppelte Trikotnummer im Matchkader. Bitte zuerst im Teamkader korrigieren.');
  if(chosen.filter(p=>p.position!=='L').length<6)throw Error('Mindestens sechs reguläre Spielerinnen auswählen.');
  return {id:uid(), teamId:team.id, teamSnapshot:clone(team), opponent:opponent.trim(),date,
    rosterIds:[...rosterIds], events:[], cursor:0, archivedEarly:false, createdAt:new Date().toISOString()};
}
function pushEvent(match, event) {
  const state = replay(match);
  if(state.finished) throw Error('Dieses Spiel ist abgeschlossen.');
  if(match.archivedEarly) throw Error('Dieses Spiel ist archiviert.');
  const next=clone(match);
  next.events=next.events.slice(0,next.cursor);
  next.events.push({...event, at:new Date().toISOString()});
  next.cursor=next.events.length;
  const result=replay(next);
  if(result.error) throw Error(result.error);
  return next;
}
// Punktkorrektur: NORMAL + RALLY gehören zu genau EINEM abgeschlossenen Ballwechsel.
// Reguläre Wechsel/Satzanfänge nach dem zu entfernenden Punkt müssen ebenfalls
// rückwärts mitgerollt werden, damit der rekonstruierte Zustand konsistent bleibt.
function lastPointIndex(match) {
  for (let i=match.cursor-1;i>=0;i--) if(match.events[i].type==='RALLY') return i;
  return -1;
}
function nextPointIndex(match) {
  for (let i=match.cursor;i<match.events.length;i++) if(match.events[i].type==='RALLY') return i;
  return -1;
}
function canUndoPoint(match){return !match.archivedEarly && (lastPointIndex(match)>=0 || match.events.slice(0,match.cursor).some(e=>e.type==='NORMAL'));}
function canRedoPoint(match){return !match.archivedEarly && (nextPointIndex(match)>=0 || match.events.slice(match.cursor).some(e=>e.type==='NORMAL'));}

  const x=clone(match);if(x.archivedEarly)return x;
  const i=lastPointIndex(x);
  if(i<0){ // Offenen, noch nicht gewerteten normalen Service zurücknehmen.
    for(let j=x.cursor-1;j>=0;j--)if(x.events[j].type==='NORMAL'){x.cursor=j;break;}

/** IndexedDB is local to this browser/device. No cloud sync, no external account. */

const dbName='serveiq-local-v02-preview';
function openDB(){return new Promise((resolve,reject)=>{
  if(!('indexedDB' in globalThis))return reject(Error('IndexedDB nicht verfügbar'));
  const r=indexedDB.open(dbName,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
});}
// Save to both browser stores. Choose the newest valid revision when starting.
// This prevents a successful fallback write from being hidden by an older IndexedDB copy.
async function load(){
  const candidates=[];
  try{
    const db=await openDB();
    const x=await new Promise((resolve,reject)=>{const t=db.transaction('kv','readonly');const r=t.objectStore('kv').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
    db.close();if(x){validateBackup(x);candidates.push(x);}
  }catch(err){console.warn('IndexedDB-Laden:',err);}
  try{
    const x=JSON.parse(localStorage.getItem('serveiq_v02_preview_emergency')||'null');
    if(x){validateBackup(x);candidates.push(x);}
  }catch(err){console.warn('Notfallsicherung-Laden:',err);}
  if(!candidates.length)return newAppData();
  return candidates.sort((a,b)=>(Number(b.__savedAt)||0)-(Number(a.__savedAt)||0))[0];
}
async function save(x){
  const snapshot=structuredClone(x);
  snapshot.__savedAt=Date.now();
  let localOk=false,dbOk=false;
  try{localStorage.setItem('serveiq_v02_preview_emergency',JSON.stringify(snapshot));localOk=true;}
  catch(err){console.warn('Lokale Notfallsicherung fehlgeschlagen:',err);}
  try{
    const db=await openDB();
    await new Promise((resolve,reject)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(snapshot,'state');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});
    db.close();dbOk=true;
  }catch(err){console.warn('IndexedDB-Speicherung fehlgeschlagen:',err);}
  return localOk||dbOk;
}

// Team saving: validate all fields, persist reliably, only then navigate.
let teamSaveBusy=false;
async function saveTeamFromFields(){
  if(teamSaveBusy)return;
  const form=document.querySelector('form[data-form="team"]');
  if(!form){showAlert('Teamformular nicht gefunden. Bitte erneut öffnen.');return;}
  const values=Object.fromEntries(new FormData(form));
  const club=(values.club||'').trim();
  const category=values.category||'';
  const league=values.league||'';
  const season=values.season||'';
  const group=values.group||'';
  if(!club){form.querySelector('[name="club"]')?.focus();showAlert('Bitte zuerst den Verein eingeben.');return;}
  if(!['Damen','Herren','Juniorinnen','Mixed'].includes(category)||!categoryLeagues(category).includes(league)){
    showAlert('Kategorie und Liga passen nicht zusammen. Bitte kontrollieren.');return;
  }
  if(!seasonOptions().includes(season)||!['','A','B','C','D'].includes(group)){
    showAlert('Bitte Saison und Gruppe kontrollieren.');return;
  }
  const current=ui.teamForm;
  if(!current){showAlert('Teamerstellung nicht mehr aktiv. Bitte erneut öffnen.');return;}
  const duplicate=data.teams.find(x=>x.id!==current.id &&
    [x.club,x.category,x.league,x.group||'',x.season].join('|').toLocaleLowerCase('de-CH')===
    [club,category,league,group,season].join('|').toLocaleLowerCase('de-CH'));
  if(duplicate){showAlert('Dieses Team ist für die gewählte Saison bereits vorhanden. Bitte öffne es in der Teamübersicht.');return;}
  const team={...current,club,category,league,season,group,players:current.players||[]};
  const before=structuredClone(data);
  const idx=team.id?data.teams.findIndex(x=>x.id===team.id):-1;
  if(team.id&&idx<0){showAlert('Team nicht gefunden. Bitte erneut öffnen.');return;}
  if(idx>=0)data.teams[idx]=team;
  else {team.id=uid();data.teams.push(team);}
  data.lastView='teams';
  teamSaveBusy=true;
  const button=form.querySelector('[data-action="team-save"]');
  if(button){button.disabled=true;button.textContent='Speichere …';}
  try {
    await saving;
    let done=await Promise.race([save(structuredClone(data)),new Promise(resolve=>setTimeout(()=>resolve(false),3500))]);
    if(!done){
      try {localStorage.setItem('serveiq_v02_preview_emergency',JSON.stringify(data));done=true;}catch{}
    }
    if(!done)throw Error('Der Browser blockiert die lokale Speicherung. Öffne die Datei in einem regulären Browserfenster (nicht im privaten Modus) oder verwende später GitHub Pages.');
    ui.teamId=team.id;ui.teamForm=null;ui.editingTeam=false;ui.view='teams';
    ui.toast='Team «'+club+'» gespeichert. Kader erfassen.';
    renderAtTop();
    setTimeout(()=>{if(ui.toast.startsWith('Team «')){ui.toast='';render();}},4000);
  }catch(err){
    data=before;
    if(button){button.disabled=false;button.textContent='Team speichern';}
    showAlert('Team konnte nicht gespeichert werden: '+(err.message||String(err)));
  }finally{teamSaveBusy=false;}
}
// Save roster entries with the same verified persistence model as team creation.
let playerSaveBusy=false;
async function savePlayerFromFields(){
  if(playerSaveBusy)return;
  const form=document.querySelector('form[data-form="player"]');
  if(!form){showAlert('Spielerinnenformular nicht gefunden. Bitte erneut öffnen.');return;}
  const values=Object.fromEntries(new FormData(form));
  const first=(values.first||'').trim(),last=(values.last||'').trim();
  const position=values.position||'';
  const number=values.number===''?NaN:Number(values.number);
  // Keep the form fully populated if any check or browser write fails.
  ui.playerDraft={first,last,position,number:values.number};
  const t=data.teams.find(t=>t.id===ui.teamId);
  let error='';
  if(!t)error='Das ausgewählte Team wurde nicht gefunden.';
  else if(!first)error='Bitte den Vornamen eingeben.';
  else if(!last)error='Bitte den Nachnamen eingeben.';
  else if(!Number.isInteger(number)||number<1||number>99)error='Bitte eine Trikotnummer von 1 bis 99 auswählen.';
  else if(t.players.some(p=>Number(p.number)===number&&p.id!==ui.playerId))error='Diese Trikotnummer ist bereits vergeben. Bitte eine andere Nummer auswählen.';
  else if(!['','A','M','P','D','L'].includes(position))error='Bitte eine gültige Position auswählen.';
  if(error){ui.playerSaveError=error;render();return;}
  const before=structuredClone(data);
  const player={id:ui.playerId||uid(),first,last,number,position};
  if(ui.playerId){
    const i=t.players.findIndex(p=>p.id===ui.playerId);
    if(i<0){ui.playerSaveError='Spielerin wurde nicht gefunden. Bitte neu öffnen.';render();return;}
    t.players[i]=player;
  }else t.players.push(player);
  playerSaveBusy=true;
  const button=form.querySelector('[data-action="player-save"]');
  if(button){button.disabled=true;button.textContent='Speichere …';}
  try{
    const snap=structuredClone(data);
    // Await prior writes and persist a complete snapshot, not only a UI update.
    saving=saving.catch(()=>false).then(()=>save(snap));
    let stored=await Promise.race([saving,new Promise(resolve=>setTimeout(()=>resolve(false),3500))]);
    if(!stored){try{localStorage.setItem('serveiq_v02_preview_emergency',JSON.stringify(snap));stored=true;}catch{}}
    if(!stored)throw Error('Der Browser erlaubt keine lokale Speicherung. Bitte öffne die HTML-Datei in Chrome oder Edge in einem normalen Fenster.');
    ui.modal='';ui.playerId=null;ui.playerDraft=null;ui.playerSaveError='';ui.numberChoice=null;ui.playerNumberPage=0;
    ui.toast='Spielerin «'+first+' '+last+'» gespeichert.';
    renderAtTop();
    setTimeout(()=>{if(ui.toast.startsWith('Spielerin «')){ui.toast='';render();}},4000);
  }catch(err){
    data=before;
    ui.playerSaveError='Spielerin konnte nicht gespeichert werden: '+(err.message||String(err));
    render();
  }finally{playerSaveBusy=false;}
}
// Explicit save buttons never navigate before the persisted state is confirmed.
let explicitSaveBusy=false;
async function persistBeforeNavigation(mutator,label){
  if(explicitSaveBusy)return false;
  explicitSaveBusy=true;
  const old=structuredClone(data);
  try{
    mutator();
    data.lastView='teams';
    const snap=structuredClone(data);
    saving=saving.catch(()=>false).then(()=>save(snap));
    let stored=await Promise.race([saving,new Promise(resolve=>setTimeout(()=>resolve(false),3500))]);
    if(!stored){try{localStorage.setItem('serveiq_v02_preview_emergency',JSON.stringify(snap));stored=true;}catch{}}
    if(!stored)throw Error('Dein Browser hat die lokale Speicherung blockiert. Bitte öffne die Datei in einem normalen Browserfenster.');
    ui.toast=label;
    return true;
  }catch(err){
    data=old;
    showAlert('Speichern fehlgeschlagen: '+(err.message||String(err)));
    return false;
  }finally{explicitSaveBusy=false;}
}

  patterns:`Wiederholter Fehler: Dieselbe Spielerin beendet einen Servicedurchgang mit Fehler und macht beim nächsten eigenen Servicedurchgang sofort wieder einen Fehler. Aufeinanderfolgende Aufschlägerinnen: Der letzte Service der vorherigen Spielerin war ein Fehler und die nächste Aufschlägerin macht bei ihrem ersten Service ebenfalls einen Fehler. Die Betrachtung beginnt pro Satz neu.`,
  details:`Gespielte Sätze = Sätze mit mindestens einem Ballwechsel auf dem Feld. Einsatz = eigene Ballwechsel / alle Ballwechsel des Satzes. Beispiel 31/47 = 31 von 47 gespielten Ballwechseln. Einsatzquote = dieser Anteil in Prozent. Die Einsatzabschnitte zeigen den Spielstand vor dem ersten und nach dem letzten Ballwechsel des jeweiligen Einsatzes. Liberawechsel werden nicht erfasst; der tatsächliche Libera-Einsatz ist daher nicht exakt messbar.`,
  phases:`Sätze 1–4: Start 0–9, Aufbau 10–19, Entscheidung ab 20; Verlängerung ab 24:24. Satz 5: Start 0–5, Aufbau 6–11, Entscheidung ab 12; Verlängerung ab 14:14. Es zählt der höhere Punktestand, ausser in der Verlängerung: dort müssen beide Teams mindestens 24 beziehungsweise 14 erreicht haben. Führung, Gleichstand, Rückstand und Satzball werden je Service im Export geführt.`,
  changes:`Ein regulärer Wechsel kostet einen der maximal sechs Wechsel pro Satz. Die ausgewechselte Startspielerin darf nur für denselben Ersatz zurückkehren. Liberawechsel werden nicht erfasst. Reguläre Wechsel werden mit Spielstand gespeichert.`
};

// Match basics are saved before moving to the match-roster step.
// A roster with fewer than six players can still reach the selection screen;
// the minimum of six *regular* players is enforced before the starting lineup.
let matchBasicBusy=false;
async function saveMatchBasicsAndNext(){
  if(matchBasicBusy)return;
  const form=root.querySelector('form[data-form="match-basic"]');
  if(!form){showAlert('Die Spieldaten konnten nicht gefunden werden. Bitte erneut öffnen.');return;}
  if(!form.reportValidity())return;
  const values=Object.fromEntries(new FormData(form));
  const team=data.teams.find(t=>t.id===values.teamId);
  const opponent=(values.opponent||'').trim();
  const date=(values.date||'').trim();
  if(!team){showAlert('Bitte ein gültiges Team auswählen.');return;}
  if(!opponent){form.querySelector('[name="opponent"]')?.focus();showAlert('Bitte den Gegner eingeben.');return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())){
    form.querySelector('[name="date"]')?.focus();showAlert('Bitte ein gültiges Datum auswählen.');return;
  }
  if(new Set(team.players.map(p=>Number(p.number))).size!==team.players.length){
    showAlert('Im Teamkader gibt es doppelte Trikotnummern. Bitte den Kader zuerst korrigieren.');return;
  }
  // Reusing saved drafts preserves the previously selected players when
  // the basic data remains unchanged; changing the team resets the choices.
  const old=ui.draft;
  const sameTeam=old&&old.teamId===team.id;
  const draft={
    teamId:team.id,opponent,date,
    rosterIds:sameTeam?[...old.rosterIds]:[],
    lineup:sameTeam?[...old.lineup]:Array(6).fill(''),
    liberoId:sameTeam?old.liberoId:'',
    side:old?.side||'',firstServe:old?.firstServe||''
  };
  const button=form.querySelector('[data-action="match-basic-save"]');
  matchBasicBusy=true;
  if(button){button.disabled=true;button.textContent='Speichere …';}
  try{
    const ok=await persistBeforeNavigation(()=>{
      data.draft=structuredClone(draft);
      data.draftStep=1;
    },'Spieldaten gespeichert.');
    if(ok){ui.draft=draft;ui.wizardStep=1;ui.missing=[];renderAtTop();}
    else if(button?.isConnected){button.disabled=false;button.textContent='Matchkader erstellen';}
  }catch(err){
    if(button?.isConnected){button.disabled=false;button.textContent='Matchkader erstellen';}
    showAlert('Spieldaten konnten nicht gespeichert werden: '+(err.message||String(err)));
  }finally{matchBasicBusy=false;}
}
// Persist a rule-validated substitution before closing its dialog.
let regularSaving=false;
async function saveRegularSubstitution(){
  if(regularSaving)return;
  const form=root.querySelector('form[data-form="regular"]');
  const m=mcurrent();
  if(!form||!m){showAlert('Wechselfenster oder Spiel nicht gefunden.');return;}
  const outId=form.querySelector('[name="outId"]')?.value;
  const inId=form.querySelector('[name="inId"]')?.value;
  if(!outId||!inId){ui.regularError='Bitte beide Spielerinnen auswählen.';render();return;}
  regularSaving=true;ui.regularError='';
  const btn=form.querySelector('[data-action="regular-confirm"]');
  if(btn){btn.disabled=true;btn.textContent='Speichere Wechsel …';}
  try{
    // No points/rotation are changed: the incoming player takes the exact current rotation slot.
    const updated=pushEvent(m,{type:'SUB',outId,inId});
    const idx=data.matches.findIndex(x=>x.id===m.id);
    if(idx<0)throw Error('Das laufende Spiel wurde nicht gefunden.');
    const copy=structuredClone(data);copy.matches[idx]=updated;copy.lastView='live';
    const snapshot=structuredClone(copy);
    saving=saving.catch(()=>false).then(()=>save(snapshot));
    let stored=await Promise.race([saving,new Promise(resolve=>setTimeout(()=>resolve(false),3500))]);
    if(!stored){try{localStorage.setItem('serveiq_v02_preview_emergency',JSON.stringify(snapshot));stored=true;}catch{}}
    if(!stored)throw Error('Die lokale Speicherung wurde vom Browser blockiert.');
    data=copy;ui.modal='';ui.regularOutId=null;ui.regularError='';ui.view='live';
    ui.toast='Spielerwechsel gespeichert.';
    renderAtTop();
    setTimeout(()=>{if(ui.toast==='Spielerwechsel gespeichert.'){ui.toast='';render();}},3500);
  }catch(err){
    ui.regularError='Wechsel nicht durchgeführt: '+(err.message||String(err));
    render();
  }finally{regularSaving=false;}
}

        ui.draft=null;ui.wizardStep=0;ui.modal='';ui.view='teams';ui.teamId=null;renderAtTop();
      }
      break;}
    case'draft-discard':{if(await persistBeforeNavigation(()=>{data.draft=null;data.draftStep=0;},'Entwurf verworfen.')){ui.draft=null;ui.wizardStep=0;ui.modal='';ui.view='teams';ui.teamId=null;renderAtTop();}break;}
    case'draft-keep':ui.modal='';render();break;
    case'ongoing-delete':confirmAction('Laufendes Spiel endgültig löschen?',()=>{data.matches=data.matches.filter(x=>x.id!==id);commit();render();});break;
    case'analysis-open':ui.analysisMode=b.dataset.mode;ui.analysisSubject='team';ui.analysisSet=0;renderAtTop();break;
    case'analysis-back':ui.analysisMode='';renderAtTop();break;
    case'lineup-change':break;
    case'set-side':ui.draft.side=b.dataset.val;render();break;
    case'set-serve':ui.draft.firstServe=b.dataset.val;render();break;
    case'confirm-match':{
      const d=ui.draft,t=data.teams.find(t=>t.id===d?.teamId);
      if(!d||!t)throw Error('Spielvorbereitung nicht gefunden.');
      const missing=lineupValidation(d);if(missing.length)throw Error('Noch zu erledigen: '+missing.join('; '));
      const m=newMatch(t,d.opponent,d.date,d.rosterIds);const started=pushEvent(m,{type:'SET_START',lineup:d.lineup,liberoId:d.liberoId,side:d.side,firstServe:d.firstServe});
      if(await persistBeforeNavigation(()=>{data.matches.push(started);data.draft=null;data.draftStep=0;},'Spiel gespeichert.')){
        ui.matchId=started.id;ui.draft=null;ui.wizardStep=0;ui.teamId=null;ui.view='teams';renderAtTop();
      }
      break;}
    case'open-live':ui.matchId=id;ui.view='live';ui.statsId=null;render();break;
    case'normal':afterEvent({type:'NORMAL'});break;
    case'rally':afterEvent({type:'RALLY',kind:b.dataset.kind,winner:b.dataset.winner});break;
    case'point-undo':{const m=mcurrent();if(!m||!canUndoPoint(m))break;const corrected=undoPoint(m);data.matches[data.matches.findIndex(x=>x.id===m.id)]=corrected;commit();render();break;}
    case'point-redo':{const m=mcurrent();if(!m||!canRedoPoint(m))break;const restored=redoPoint(m);data.matches[data.matches.findIndex(x=>x.id===m.id)]=restored;commit();render();break;}
    case'undo':{const m=mcurrent();if(!m)return;data.matches[data.matches.findIndex(x=>x.id===m.id)]=undo(m);commit();render();break;}
    case'redo':{const m=mcurrent();if(!m)return;data.matches[data.matches.findIndex(x=>x.id===m.id)]=redo(m);commit();render();break;}
    case'side-toggle':afterEvent({type:'SIDE'});break;
    case'change-open':ui.modal='change';render();break;
    case'change-type':ui.modal=b.dataset.type==='regular'?'regular':'libero';ui.regularOutId=null;ui.regularError='';render();break;
    case'regular-confirm':await saveRegularSubstitution();break;
    case'stop-open':ui.modal='stop';render();break;
    case'stop-archive':{const m=mcurrent();m.archivedEarly=true;ui.modal='';ui.view='archive';commit();render();break;}
    case'stop-delete':confirmAction('Das gesamte Spiel unwiderruflich löschen?',()=>{data.matches=data.matches.filter(x=>x.id!==ui.matchId);ui.modal='';ui.view='archive';commit();render();});break;
    case'prepare-set':ui.nextOptions=null;ui.pickedPlayer=null;ui.missing=[];ui.modal='nextset';render();break;
    case'stats-open':ui.analysisMode='';ui.statsReturn=ui.view;ui.statsId=id;ui.statsSet=0;ui.statsPlayer=null;ui.modal='';ui.view='archive';renderAtTop();break;
    case'stats-close':ui.analysisMode='';ui.statsId=null;ui.view=ui.statsReturn==='live'?'live':'archive';renderAtTop();break;
    case'stats-home-close':ui.analysisMode='';ui.statsId=null;ui.statsPlayer=null;ui.statsSet=0;ui.statsReturn='archive';ui.view='teams';ui.modal='';renderAtTop();break;
    case'stats-filter':ui.statsSet=Number(b.dataset.number);ui.statsPlayer=null;render();break;
    case'stats-player':ui.statsPlayer=id;render();break;
    case'info':ui.info=id;ui.modal='info';render();break;
    case'excel':{const m=data.matches.find(x=>x.id===id);downloadBlob(excelBlob(m),`ServeIQ_${m.date}_${m.opponent.replace(/[^a-z0-9äöü-]/gi,'_').slice(0,32)}.xlsx`);toast('Excel-Datei wird heruntergeladen.');break;}
    case'json-export':downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`ServeIQ_Sicherung_${new Date().toISOString().slice(0,10)}.json`);toast('JSON-Sicherung wird heruntergeladen.');break;
    case'json-import':fileInput.click();break;
    case'match-delete':confirmAction('Spiel und alle Statistiken endgültig löschen?',()=>{data.matches=data.matches.filter(x=>x.id!==id);ui.statsId=null;commit();render();});break;
    case'modal-close':ui.modal='';render();break;
    case'confirm-yes':{const f=ui.confirmFn;ui.confirmFn=null;ui.modal='';if(f)f();break;}
    default:break;
  }}catch(err){showAlert(err.message||String(err));}
});
root.addEventListener('input',e=>{if(e.target.closest('[data-form="player"]')&&['first','last','number'].includes(e.target.name)){ui.playerDraft={...(ui.playerDraft||{}),[e.target.name]:e.target.value};if(e.target.name==='number'){ui.numberChoice=Number(e.target.value)||null;document.querySelectorAll('.number-choice').forEach(x=>x.classList.toggle('selected',Number(x.dataset.number)===ui.numberChoice));}}});
root.addEventListener('change',e=>{
  const t=e.target,action=t.dataset.action;
  if(t.closest('[data-form="player"]')&&t.name==='position')ui.playerDraft={...(ui.playerDraft||{}),position:t.value};
  if(action==='regular-out'){ui.regularOutId=t.value;ui.regularError='';render();return;}
  if(action==='analysis-subject'){ui.analysisSubject=t.value;render();}
  if(action==='analysis-set'){ui.analysisSet=Number(t.value);render();}
  if(action==='next-libero'){ui.nextOptions.liberoId=t.value;render();}
  if(action==='lineup-change'){ui.draft.lineup[Number(t.dataset.pos)]=t.value;}
  if(action==='libero-select'){ui.draft.liberoId=t.value;}
  if(action==='roster-toggle'){const list=ui.draft.rosterIds;if(t.checked){if(!list.includes(t.dataset.id))list.push(t.dataset.id);}else ui.draft.rosterIds=list.filter(x=>x!==t.dataset.id);render();}
  if(action==='stats-select-player'){ui.statsPlayer=t.value;render();}
  if(t.name==='position'&&t.closest('[data-form="player"]')){ui.playerDraft={...(ui.playerDraft||{}),position:t.value};}
  if(t.name==='category'&&t.closest('[data-form="team"]')){const form=t.closest('form');form.querySelector('[name="league"]').innerHTML=selectOpt(categoryLeagues(t.value),'');}
});
root.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const form=e.target.closest('form[data-form="player"]');
  if(form){
    const next={first:'last',last:'position',position:'number'}[e.target.name];
    if(next){e.preventDefault();form.querySelector(`[name="${next}"]`)?.focus();return;}
    if(e.target.name==='number'){
      e.preventDefault();form.querySelector('[data-action="player-save"]')?.focus();savePlayerFromFields();return;
    }
  }
  if(e.target.closest('form[data-form="team"]')&&e.target.tagName==='INPUT'){
    e.preventDefault();saveTeamFromFields();
  }
});
root.addEventListener('submit',e=>{
  const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const d=Object.fromEntries(new FormData(form));
  try{switch(form.dataset.form){
    case'team':{saveTeamFromFields();break;}
    case'player':{savePlayerFromFields();break;}
    case'match-basic':{void saveMatchBasicsAndNext();break;}
    case'regular':void saveRegularSubstitution();break;
    case'nextset':{const m=mcurrent(),st=replay(m),n=st.sets.length+1;
      const e={type:'SET_START',lineup:Array.from({length:6},(_,i)=>d[`pos${i}`]),liberoId:d.liberoId,side:d.side,firstServe:d.firstServe};
      if(n<=4)e.firstServe=opposite(st.current.firstServe);
      if(n===5&&!e.firstServe)throw Error('Im fünften Satz den ersten Service nach Auslosung auswählen.');
      afterEvent(e);if(ui.modal!=='alert')ui.modal='';render();break;}
  }}catch(err){showAlert(err.message||String(err));}
});

const fileInput=document.createElement('input');fileInput.type='file';fileInput.id='import-file';fileInput.accept='.json,application/json';fileInput.hidden=true;document.body.append(fileInput);
fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file)return;
 try{const parsed=JSON.parse(await file.text());validateBackup(parsed);
   confirmAction('JSON-Sicherung importieren? Alle bisher auf diesem Gerät gespeicherten Teams und Spiele werden ersetzt.',()=>{
     data=parsed;ui.statsId=null;ui.matchId=null;ui.draft=null;ui.teamId=null;ui.view='teams';data.introSeen=true;commit();render();});
 }catch(err){showAlert(`Import fehlgeschlagen: ${err.message}`);}finally{fileInput.value='';}
});
(async()=>{data=await load();ui.view='teams';armNav();if(ui.view==='live'){const m=activeMatch();if(m)ui.matchId=m.id;}render();})();

let swipeStart=0;root.addEventListener('touchstart',e=>{if(e.touches.length===1&&e.touches[0].clientY>window.innerHeight-60)swipeStart=e.touches[0].clientY;},{passive:true});root.addEventListener('touchend',e=>{if(swipeStart&&e.changedTouches[0].clientY<swipeStart-22){ui.menuOpen=true;armNav();render();}swipeStart=0;},{passive:true});

// Drag/drop on desktop, plus mobile touch drag on initial and subsequent sets.
let dragging=null;
function placingContext(){return ui.modal==='nextset'?ui.nextOptions:ui.draft;}
function placeDraggedPlayer(playerId,pos){
 const d=placingContext(); if(!d||!Number.isInteger(pos)||pos<0||pos>5)return false;
 if(!d.rosterIds.includes(playerId))return false;
 const roster=ui.modal==='nextset'?mcurrent()?.teamSnapshot.players:data.teams.find(t=>t.id===d.teamId)?.players;
 const player=roster?.find(p=>p.id===playerId);
 if(!player||player.position==='L')return false;
 const old=d.lineup.indexOf(playerId);if(old>=0)d.lineup[old]='';
 d.lineup[pos]=playerId;ui.pickedPlayer=null;ui.missing=[];render();return true;
}
root.addEventListener('dragstart',e=>{
 const b=e.target.closest('[data-action="court-player"]');
 if(b){dragging=b.dataset.id;e.dataTransfer?.setData('text/plain',dragging);if(e.dataTransfer)e.dataTransfer.effectAllowed='move';}
});
root.addEventListener('dragend',()=>{dragging=null;});
root.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault();});
root.addEventListener('drop',e=>{
 const target=e.target.closest('[data-drop]');if(!target)return;
 const id=dragging||e.dataTransfer?.getData('text/plain');
 if(!id)return;e.preventDefault();placeDraggedPlayer(id,Number(target.dataset.drop));dragging=null;
});
let touchChoice=null;
root.addEventListener('touchstart',e=>{
 const b=e.target.closest('[data-action="court-player"]');
 if(b&&e.touches.length===1)touchChoice={id:b.dataset.id,x:e.touches[0].clientX,y:e.touches[0].clientY,moving:false};
},{passive:true});
root.addEventListener('touchmove',e=>{
 if(!touchChoice||e.touches.length!==1)return;
 const t=e.touches[0],dist=Math.hypot(t.clientX-touchChoice.x,t.clientY-touchChoice.y);
 if(dist>15){touchChoice.moving=true;e.preventDefault();}
},{passive:false});
root.addEventListener('touchend',e=>{
 if(!touchChoice)return;
 const t=e.changedTouches[0];
 const dist=Math.hypot(t.clientX-touchChoice.x,t.clientY-touchChoice.y);
 if(touchChoice.moving&&dist>25){
   const field=document.elementFromPoint(t.clientX,t.clientY)?.closest('[data-drop]');
   if(field){e.preventDefault();placeDraggedPlayer(touchChoice.id,Number(field.dataset.drop));}
 }
 touchChoice=null;
},{passive:false});
